<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 32" width="400" height="32" fill="none">
  <!-- Sacred South Indian Mango Leaf & Golden Marigold Garland -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Sacred Golden Garland Cord -->
    <path d="M 0 8 Q 50 18 100 8 T 200 8 T 300 8 T 400 8" stroke="#FFE600" stroke-width="1.2" stroke-dasharray="4 2" opacity="0.85"/>

    <!-- Repeating Unit 1 (0 to 100) -->
    <!-- Mango Leaf 1 -->
    <path d="M 25 8 C 18 14, 18 24, 25 29 C 32 24, 32 14, 25 8 Z" fill="#1E9E3A"/>
    <line x1="25" y1="9" x2="25" y2="27" stroke="#0D5920" stroke-width="1"/>
    <circle cx="25" cy="8" r="2.8" fill="#FFE600"/>
    <circle cx="25" cy="8" r="1.4" fill="#E23744"/>

    <!-- Mango Leaf 2 -->
    <path d="M 75 8 C 68 14, 68 24, 75 29 C 82 24, 82 14, 75 8 Z" fill="#008738"/>
    <line x1="75" y1="9" x2="75" y2="27" stroke="#0D5920" stroke-width="1"/>
    <circle cx="75" cy="8" r="2.8" fill="#FFE600"/>
    <circle cx="75" cy="8" r="1.4" fill="#FFA500"/>

    <!-- Repeating Unit 2 (100 to 200) -->
    <!-- Mango Leaf 3 -->
    <path d="M 125 8 C 118 14, 118 24, 125 29 C 132 24, 132 14, 125 8 Z" fill="#1E9E3A"/>
    <line x1="125" y1="9" x2="125" y2="27" stroke="#0D5920" stroke-width="1"/>
    <circle cx="125" cy="8" r="2.8" fill="#FFE600"/>
    <circle cx="125" cy="8" r="1.4" fill="#E23744"/>

    <!-- Mango Leaf 4 -->
    <path d="M 175 8 C 168 14, 168 24, 175 29 C 182 24, 182 14, 175 8 Z" fill="#008738"/>
    <line x1="175" y1="9" x2="175" y2="27" stroke="#0D5920" stroke-width="1"/>
    <circle cx="175" cy="8" r="2.8" fill="#FFE600"/>
    <circle cx="175" cy="8" r="1.4" fill="#FFA500"/>

    <!-- Repeating Unit 3 (200 to 300) -->
    <!-- Mango Leaf 5 -->
    <path d="M 225 8 C 218 14, 218 24, 225 29 C 232 24, 232 14, 225 8 Z" fill="#1E9E3A"/>
    <line x1="225" y1="9" x2="225" y2="27" stroke="#0D5920" stroke-width="1"/>
    <circle cx="225" cy="8" r="2.8" fill="#FFE600"/>
    <circle cx="225" cy="8" r="1.4" fill="#E23744"/>

    <!-- Mango Leaf 6 -->
    <path d="M 275 8 C 268 14, 268 24, 275 29 C 282 24, 282 14, 275 8 Z" fill="#008738"/>
    <line x1="275" y1="9" x2="275" y2="27" stroke="#0D5920" stroke-width="1"/>
    <circle cx="275" cy="8" r="2.8" fill="#FFE600"/>
    <circle cx="275" cy="8" r="1.4" fill="#FFA500"/>

    <!-- Repeating Unit 4 (300 to 400) -->
    <!-- Mango Leaf 7 -->
    <path d="M 325 8 C 318 14, 318 24, 325 29 C 332 24, 332 14, 325 8 Z" fill="#1E9E3A"/>
    <line x1="325" y1="9" x2="325" y2="27" stroke="#0D5920" stroke-width="1"/>
    <circle cx="325" cy="8" r="2.8" fill="#FFE600"/>
    <circle cx="325" cy="8" r="1.4" fill="#E23744"/>

    <!-- Mango Leaf 8 -->
    <path d="M 375 8 C 368 14, 368 24, 375 29 C 382 24, 382 14, 375 8 Z" fill="#008738"/>
    <line x1="375" y1="9" x2="375" y2="27" stroke="#0D5920" stroke-width="1"/>
    <circle cx="375" cy="8" r="2.8" fill="#FFE600"/>
    <circle cx="375" cy="8" r="1.4" fill="#FFA500"/>
  </g>
</svg>
